[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-project"
version = "0.1.0"
description = "A small RAG pipeline built from scratch (numpy + SQLite) with its own evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pypdf>=4.0",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
rag = "rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
